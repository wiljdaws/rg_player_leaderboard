name: Bug report
description: Something on the player leaderboard is wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, do not use this form — see [SECURITY.md](https://github.com/wiljdaws/rg_player_leaderboard/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect?
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Tab
      options:
        - 1v1
        - 2v2
        - 3v3
        - Wins
        - Sync
        - Access
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 128, Firefox 141, …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://wiljdaws.github.io/rg_player_leaderboard/
