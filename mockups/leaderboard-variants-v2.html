<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leaderboard style variants v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../css/leaderboard.css?mock=2">
<style>
  body{padding:32px}
  .mock-section{max-width:1440px;margin:0 auto 36px}
  .mock-section-title{
    font:800 14px var(--display);letter-spacing:.34em;text-transform:uppercase;
    color:var(--ink);margin:0 0 18px 8px;
  }
  .mock-section-title small{color:var(--ink-dim);font-weight:600;letter-spacing:.18em;margin-left:12px}
  .mock-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;
  }
  .mock-cell{
    background:linear-gradient(180deg,rgba(19,27,68,.5),rgba(12,18,48,.7));
    border:1px solid var(--line);border-radius:18px;padding:18px 18px 24px;
  }
  .mock-title{
    font:700 12px var(--display);letter-spacing:.28em;
    text-transform:uppercase;color:var(--grad-a);margin-bottom:2px;
  }
  .mock-desc{color:var(--ink-dim);font-size:12.5px;margin-bottom:14px;line-height:1.5}
  .mock-board{
    background:linear-gradient(180deg,rgba(19,27,68,.72),rgba(12,18,48,.86));
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
  }
  .mock-head{
    display:grid;grid-template-columns:60px 1fr 100px 90px;gap:10px;
    padding:11px 18px;border-bottom:1px solid var(--line);
    font:600 10.5px var(--display);letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .mock-head .num{text-align:right}
  .mock-row{
    display:grid;grid-template-columns:60px 1fr 100px 90px;gap:10px;
    padding:11px 18px;align-items:center;
    border-bottom:1px solid var(--line);position:relative;overflow:hidden;
  }
  .mock-row:last-child{border-bottom:none}
  .mock-rank{font:italic 700 21px var(--display);color:var(--ink-dim);z-index:1}
  .mock-ident{display:flex;align-items:center;gap:10px;min-width:0;z-index:1;position:relative}
  .mock-flag{
    flex:none;width:30px;height:30px;border-radius:9px;overflow:hidden;
    background:rgba(255,255,255,.05);border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);font:700 11px var(--display);
  }
  .mock-name{
    font:700 15px var(--display);letter-spacing:.02em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .mock-mmr{
    text-align:right;font:700 17px var(--display);color:var(--ink);
    font-variant-numeric:tabular-nums;z-index:1;
  }
  .mock-delta{
    text-align:right;font:700 12px var(--display);letter-spacing:.03em;
    font-variant-numeric:tabular-nums;z-index:1;
  }
  .mock-delta.up{color:var(--gain)}
  .mock-delta.down{color:var(--loss)}
  .mock-delta.flat{color:var(--ink-dim)}

  /* =========================================================
     WASH FAMILY (Pal's #3, stronger)
     ========================================================= */

  /* ---- W1 · Bold horizontal wash ------------------------- */
  .w1 .mock-row[data-rank="1"]{background:linear-gradient(90deg,rgba(255,210,74,.42),rgba(255,210,74,.10) 55%,transparent 90%)}
  .w1 .mock-row[data-rank="2"]{background:linear-gradient(90deg,rgba(201,212,232,.36),rgba(201,212,232,.09) 55%,transparent 90%)}
  .w1 .mock-row[data-rank="3"]{background:linear-gradient(90deg,rgba(224,154,92,.36),rgba(224,154,92,.09) 55%,transparent 90%)}
  .w1 .mock-row.top10{background:linear-gradient(90deg,rgba(168,85,247,.24),rgba(168,85,247,.06) 55%,transparent 90%)}

  /* ---- W2 · Two-sided glow (left AND right) -------------- */
  .w2 .mock-row[data-rank="1"]{background:linear-gradient(90deg,rgba(255,210,74,.38) 0%,transparent 40%,transparent 60%,rgba(255,210,74,.28) 100%)}
  .w2 .mock-row[data-rank="2"]{background:linear-gradient(90deg,rgba(201,212,232,.32),transparent 40%,transparent 60%,rgba(201,212,232,.24) 100%)}
  .w2 .mock-row[data-rank="3"]{background:linear-gradient(90deg,rgba(224,154,92,.34),transparent 40%,transparent 60%,rgba(224,154,92,.24) 100%)}
  .w2 .mock-row.top10{background:linear-gradient(90deg,rgba(168,85,247,.20),transparent 40%,transparent 60%,rgba(168,85,247,.14) 100%)}

  /* ---- W3 · Diagonal wash -------------------------------- */
  .w3 .mock-row[data-rank="1"]{background:linear-gradient(115deg,rgba(255,210,74,.44),rgba(255,210,74,.10) 50%,transparent 80%)}
  .w3 .mock-row[data-rank="2"]{background:linear-gradient(115deg,rgba(201,212,232,.36),rgba(201,212,232,.10) 50%,transparent 80%)}
  .w3 .mock-row[data-rank="3"]{background:linear-gradient(115deg,rgba(224,154,92,.36),rgba(224,154,92,.10) 50%,transparent 80%)}
  .w3 .mock-row.top10{background:linear-gradient(115deg,rgba(168,85,247,.20),rgba(168,85,247,.05) 50%,transparent 80%)}

  /* ---- W4 · Radial spotlight behind the name ------------- */
  .w4 .mock-row[data-rank="1"]{background:radial-gradient(ellipse 60% 90% at 30% 50%,rgba(255,210,74,.48),transparent 65%)}
  .w4 .mock-row[data-rank="2"]{background:radial-gradient(ellipse 60% 90% at 30% 50%,rgba(201,212,232,.42),transparent 65%)}
  .w4 .mock-row[data-rank="3"]{background:radial-gradient(ellipse 60% 90% at 30% 50%,rgba(224,154,92,.42),transparent 65%)}
  .w4 .mock-row.top10{background:radial-gradient(ellipse 60% 90% at 30% 50%,rgba(168,85,247,.24),transparent 65%)}

  /* ---- W5 · Wash + left accent bar (belt + suspenders) --- */
  .w5 .mock-row{padding-left:24px}
  .w5 .mock-row::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;z-index:0;
  }
  .w5 .mock-row[data-rank="1"]{background:linear-gradient(90deg,rgba(255,210,74,.34),transparent 70%)}
  .w5 .mock-row[data-rank="1"]::before{background:linear-gradient(180deg,#FFEDA0,var(--gold));box-shadow:0 0 16px var(--gold)}
  .w5 .mock-row[data-rank="2"]{background:linear-gradient(90deg,rgba(201,212,232,.30),transparent 70%)}
  .w5 .mock-row[data-rank="2"]::before{background:linear-gradient(180deg,#F1F6FF,var(--silver));box-shadow:0 0 12px var(--silver)}
  .w5 .mock-row[data-rank="3"]{background:linear-gradient(90deg,rgba(224,154,92,.30),transparent 70%)}
  .w5 .mock-row[data-rank="3"]::before{background:linear-gradient(180deg,#F0B87F,var(--bronze));box-shadow:0 0 12px var(--bronze)}
  .w5 .mock-row.top10{background:linear-gradient(90deg,rgba(168,85,247,.16),transparent 70%)}
  .w5 .mock-row.top10::before{background:linear-gradient(180deg,var(--grad-a),var(--grad-b));opacity:.7}

  /* =========================================================
     FOIL SHIMMER FAMILY (your #7)
     ========================================================= */

  /* Base foil-shimmer name styling shared across F1-F5. Each variant
     overrides animation speed, gradient direction, or extra layers. */
  .foil-name{
    background-clip:text;-webkit-background-clip:text;color:transparent;
    background-size:250% 100%,100% 100%;
  }
  .foil-name.gold  { background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.4) 45%,transparent 60%),linear-gradient(90deg,var(--gold),#FFEDA0,var(--gold));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:250% 100%,100% 100%}
  .foil-name.silver{ background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.5) 45%,transparent 60%),linear-gradient(90deg,var(--silver),#FFFFFF,var(--silver));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:250% 100%,100% 100%}
  .foil-name.bronze{ background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.4) 45%,transparent 60%),linear-gradient(90deg,var(--bronze),#F6C09A,var(--bronze));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:250% 100%,100% 100%}

  @keyframes foil-sweep{0%{background-position:250% 0,0 0}100%{background-position:-150% 0,0 0}}
  @keyframes foil-sweep-fast{0%{background-position:250% 0,0 0}100%{background-position:-150% 0,0 0}}
  @keyframes foil-sweep-vertical{0%{background-position:0 250%,0 0}100%{background-position:0 -150%,0 0}}
  @keyframes foil-row-sweep{0%{background-position:250% 0}100%{background-position:-100% 0}}

  /* ---- F1 · Fast, tight shimmer (2s cycle) --------------- */
  .f1 .mock-row[data-rank="1"] .mock-name{animation:foil-sweep-fast 2.2s linear infinite}
  .f1 .mock-row[data-rank="2"] .mock-name{animation:foil-sweep-fast 2.2s linear infinite;animation-delay:.5s}
  .f1 .mock-row[data-rank="3"] .mock-name{animation:foil-sweep-fast 2.2s linear infinite;animation-delay:1s}

  /* ---- F2 · Slow luxurious shimmer (6s cycle) ------------ */
  .f2 .mock-row[data-rank="1"] .mock-name,
  .f2 .mock-row[data-rank="2"] .mock-name,
  .f2 .mock-row[data-rank="3"] .mock-name{animation:foil-sweep 6s linear infinite}

  /* ---- F3 · Vertical shimmer sweep ----------------------- */
  .f3 .mock-row[data-rank="1"] .mock-name,
  .f3 .mock-row[data-rank="2"] .mock-name,
  .f3 .mock-row[data-rank="3"] .mock-name{
    background-size:100% 250%,100% 100% !important;
    animation:foil-sweep-vertical 4s linear infinite;
  }
  .f3 .mock-row[data-rank="1"] .mock-name{background:linear-gradient(180deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%),linear-gradient(180deg,var(--gold),#FFEDA0,var(--gold));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:100% 250%,100% 100%}
  .f3 .mock-row[data-rank="2"] .mock-name{background:linear-gradient(180deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%),linear-gradient(180deg,var(--silver),#FFFFFF,var(--silver));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:100% 250%,100% 100%}
  .f3 .mock-row[data-rank="3"] .mock-name{background:linear-gradient(180deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%),linear-gradient(180deg,var(--bronze),#F6C09A,var(--bronze));background-clip:text;-webkit-background-clip:text;color:transparent;background-size:100% 250%,100% 100%}

  /* ---- F4 · Prismatic rainbow shimmer -------------------- */
  .f4 .mock-row[data-rank="1"] .mock-name,
  .f4 .mock-row[data-rank="2"] .mock-name,
  .f4 .mock-row[data-rank="3"] .mock-name{
    background:linear-gradient(115deg,transparent 15%,rgba(255,120,180,.5) 35%,rgba(120,220,255,.5) 50%,rgba(255,240,120,.5) 65%,transparent 80%),
               linear-gradient(90deg,var(--gold),#FFEDA0,var(--gold));
    background-clip:text;-webkit-background-clip:text;color:transparent;
    background-size:250% 100%,100% 100%;
    animation:foil-sweep 4.5s linear infinite;
  }
  .f4 .mock-row[data-rank="2"] .mock-name{background-image:linear-gradient(115deg,transparent 15%,rgba(255,120,180,.5) 35%,rgba(120,220,255,.5) 50%,rgba(255,240,120,.5) 65%,transparent 80%),linear-gradient(90deg,var(--silver),#FFFFFF,var(--silver))}
  .f4 .mock-row[data-rank="3"] .mock-name{background-image:linear-gradient(115deg,transparent 15%,rgba(255,120,180,.5) 35%,rgba(120,220,255,.5) 50%,rgba(255,240,120,.5) 65%,transparent 80%),linear-gradient(90deg,var(--bronze),#F6C09A,var(--bronze))}

  /* ---- F5 · Full-row shimmer (background + name) --------- */
  .f5 .mock-row[data-rank="1"]{
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.10) 45%,transparent 60%),
               linear-gradient(90deg,rgba(255,210,74,.20),transparent 85%);
    background-size:250% 100%,100% 100%;
    animation:foil-row-sweep 5s linear infinite;
  }
  .f5 .mock-row[data-rank="2"]{
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.12) 45%,transparent 60%),
               linear-gradient(90deg,rgba(201,212,232,.18),transparent 85%);
    background-size:250% 100%,100% 100%;
    animation:foil-row-sweep 5s linear infinite;animation-delay:.7s;
  }
  .f5 .mock-row[data-rank="3"]{
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.10) 45%,transparent 60%),
               linear-gradient(90deg,rgba(224,154,92,.18),transparent 85%);
    background-size:250% 100%,100% 100%;
    animation:foil-row-sweep 5s linear infinite;animation-delay:1.4s;
  }
  .f5 .mock-row[data-rank="1"] .mock-name,
  .f5 .mock-row[data-rank="2"] .mock-name,
  .f5 .mock-row[data-rank="3"] .mock-name{animation:foil-sweep 4.5s linear infinite}

  /* Top-4-10 for foil family — subtle static purple tint on the name */
  .foil-scope .mock-row.top10 .mock-name{
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    background-clip:text;-webkit-background-clip:text;color:transparent;
    filter:drop-shadow(0 0 6px rgba(168,85,247,.25));
  }
</style>
</head>
<body>
<header style="text-align:center;margin-bottom:36px">
  <span class="title-kicker">Rocket Goal</span>
  <h1>Style variants · round 2</h1>
  <p class="sub">Pal picked #3 (background wash) but wants a stronger effect. You picked #7 (foil shimmer). Below: 5 variations of each.</p>
</header>

<section class="mock-section">
  <h2 class="mock-section-title">Wash family <small>Pal's #3, dialed up</small></h2>
  <div class="mock-grid" id="washGrid"></div>
</section>

<section class="mock-section foil-scope">
  <h2 class="mock-section-title">Foil shimmer family <small>your #7, five directions</small></h2>
  <div class="mock-grid" id="foilGrid"></div>
</section>

<script>
const ROWS = [
  { flag: "🇳🇱", name: "[MEOW] NEWSOULZZS", mmr: 20384, delta: +42 },
  { flag: "🇺🇸", name: "[KING] Grand Plat",  mmr: 10641, delta: +18 },
  { flag: "🇺🇸", name: "[KING] Xuuya",       mmr: 10193, delta: -12 },
  { flag: "🇫🇷", name: "Lucy",                mmr:  8842, delta:  +6 },
  { flag: "🇳🇱", name: "[MEOW] NEWSOULZZS",   mmr:  7922, delta:  +3 },
  { flag: "🇩🇪", name: "MrDarksoul",          mmr:  7053, delta:   0 },
  { flag: "🇺🇸", name: "[MEOW] sO1emnt",      mmr:  5041, delta:  -8 },
  { flag: "🇺🇸", name: "[MEOW] .crystxll",    mmr:  4995, delta: +25 },
  { flag: "🇨🇦", name: "[KING] P",            mmr:  4943, delta:  -4 },
  { flag: "🇺🇸", name: "Chop",                mmr:  4806, delta:  +9 },
];

const WASH_VARIANTS = [
  { id: "w1", title: "W1 · Bold horizontal",   desc: "Alpha bumped from .18 to .42 and the fade pushed past mid-row. Same shape as #3, just louder." },
  { id: "w2", title: "W2 · Two-sided glow",    desc: "Metal color fades from both edges, leaving a slight dark middle. Row looks framed." },
  { id: "w3", title: "W3 · Diagonal wash",     desc: "Same as W1 but tilted 25° — feels like a light hitting the row from an angle." },
  { id: "w4", title: "W4 · Radial spotlight",  desc: "Elliptical hotspot centered where the name sits; darker toward the row edges." },
  { id: "w5", title: "W5 · Wash + edge bar",   desc: "Strong left-side accent bar (like #1) plus the horizontal wash. Layered emphasis." },
];

const FOIL_VARIANTS = [
  { id: "f1", title: "F1 · Fast tight sweep",  desc: "Shorter cycle (2.2s) with staggered delays so the three rows don't shimmer in unison." },
  { id: "f2", title: "F2 · Slow & luxurious",  desc: "Same #7 sweep at 6s. Reads calmer, more premium." },
  { id: "f3", title: "F3 · Vertical shimmer",  desc: "Sweep drops top-to-bottom instead of side-to-side. Feels like liquid poured over letters." },
  { id: "f4", title: "F4 · Prismatic rainbow", desc: "Sweep is 3-band chromatic (pink→cyan→yellow) instead of white — full holographic card look." },
  { id: "f5", title: "F5 · Full-row shimmer",  desc: "Adds a slow shimmer to the row background too, not just the name. Whole podium row breathes." },
];

function foilNameClass(rank) {
  return rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
}

function renderBoard(variantId, isFoil) {
  const board = document.createElement("div");
  board.className = "mock-board " + variantId;
  const head = document.createElement("div");
  head.className = "mock-head";
  head.innerHTML = "<span>Rank</span><span>Player</span><span class='num'>MMR</span><span class='num'>Recent</span>";
  board.appendChild(head);
  ROWS.forEach((r, i) => {
    const rank = i + 1;
    const row = document.createElement("div");
    row.className = "mock-row" + (rank >= 4 && rank <= 10 ? " top10" : "");
    row.setAttribute("data-rank", rank);
    const rankCell = document.createElement("span");
    rankCell.className = "mock-rank";
    rankCell.textContent = "#" + rank;
    row.appendChild(rankCell);

    const ident = document.createElement("span");
    ident.className = "mock-ident";
    const flag = document.createElement("span");
    flag.className = "mock-flag";
    flag.textContent = r.flag;
    ident.appendChild(flag);
    const name = document.createElement("span");
    name.className = "mock-name";
    if (isFoil && rank <= 3) name.classList.add("foil-name", foilNameClass(rank));
    name.textContent = r.name;
    ident.appendChild(name);
    row.appendChild(ident);

    const mmr = document.createElement("span");
    mmr.className = "mock-mmr";
    mmr.textContent = r.mmr.toLocaleString();
    row.appendChild(mmr);

    const delta = document.createElement("span");
    const cls = r.delta > 0 ? "up" : r.delta < 0 ? "down" : "flat";
    delta.className = "mock-delta " + cls;
    delta.textContent = r.delta === 0 ? "— flat" : (r.delta > 0 ? "+" : "") + r.delta;
    row.appendChild(delta);

    board.appendChild(row);
  });
  return board;
}

function buildGrid(host, variants, isFoil) {
  for (const variant of variants) {
    const cell = document.createElement("section");
    cell.className = "mock-cell";
    const title = document.createElement("div");
    title.className = "mock-title";
    title.textContent = variant.title;
    const desc = document.createElement("p");
    desc.className = "mock-desc";
    desc.textContent = variant.desc;
    cell.append(title, desc, renderBoard(variant.id, isFoil));
    host.appendChild(cell);
  }
}

buildGrid(document.getElementById("washGrid"), WASH_VARIANTS, false);
buildGrid(document.getElementById("foilGrid"), FOIL_VARIANTS, true);
</script>
</body>
</html>
